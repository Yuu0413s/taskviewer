version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # dotenv: 17.x系にAIエージェント向けプロンプトインジェクションを含む
    # バージョンが確認されているため、自動更新の対象から外し手動レビューを必須にする
    ignore:
      - dependency-name: "dotenv"
    # 関連パッケージをまとめて1つのPRにする（PRが乱立するのを防ぐ）
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
